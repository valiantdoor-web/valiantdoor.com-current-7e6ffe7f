name: Indexing Contract

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-indexing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Preservation tests compare FAQ, CSP, navigation, and SEO copy to
          # their recorded baseline commits; a shallow checkout cannot run them.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
